# Deploys token-usage-experiment/report.html to GitHub Pages at
# /token-usage-experiment/. Only the report is published, not the rest of the repo.
name: Publish token usage report

on:
  push:
    branches: [main]
    paths:
      - token-usage-experiment/report.html
      - .github/workflows/publish-token-report.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}token-usage-experiment/
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/token-usage-experiment
          cp token-usage-experiment/report.html _site/token-usage-experiment/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
